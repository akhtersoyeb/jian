[package]
name = "jian"
version = "0.1.0"
edition = "2021"
description = "Jian Code: a local, offline coding agent for your terminal (Ollama)"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rustyline = "14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
toml = "0.8"
ignore = "0.4"
regex = "1"
