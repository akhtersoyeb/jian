[package]
name = "jian"
version = "0.1.0"
edition = "2021"
description = "Jian Code: a local, offline coding agent for your terminal (Ollama)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/akhtersoyeb/jian"
keywords = ["cli", "ai", "ollama", "coding-agent", "llm"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
futures-util = "0.3"
ignore = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
rustyline = "14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "time"] }
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
